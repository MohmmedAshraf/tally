app = "tally-playground"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"
  ignorefile = "Dockerfile.dockerignore"

[env]
  PORT = "8080"
  CLIENT_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
