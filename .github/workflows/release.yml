name: Release

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/select-mode@v2
        id: mode
      - if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@v2
        with:
          script: pnpm version-packages
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
      - if: steps.mode.outputs.mode == 'publish'
        uses: changesets/action/publish@v2
        with:
          script: pnpm release
          create-github-releases: true
